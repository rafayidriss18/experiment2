<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Sherbano</title>
    <style>
        body { margin: 0; background-color: #000; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif; overflow: hidden; }
        #play-screen { text-align: center; color: white; }
        .netflix-btn { padding: 15px 40px; background-color: #E50914; border: none; color: white; font-size: 1.2rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
    </style>
</head>
<body>

    <div id="play-screen">
        <h1 style="font-size: 3rem; margin-bottom: 20px;">Who's watching?</h1>
        <button class="netflix-btn" onclick="startSurprise()">Open Netflix</button>
    </div>

    <video id="surprise-video" src="final_edit.mp4" playsinline></video>

    <script>
        function startSurprise() {
            const vid = document.getElementById('surprise-video');
            const screen = document.getElementById('play-screen');
            screen.style.display = 'none';
            vid.style.display = 'block';
            vid.play();
        }
    </script>
</body>
</html>
